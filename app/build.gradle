plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swifttap'
    compileSdk 34

    defaultConfig {
        applicationId 'com.swifttap'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
